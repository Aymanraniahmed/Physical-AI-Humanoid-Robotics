# Qdrant vector database ko locally run karne ke liye
# Command: docker-compose up -d

version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vectordb
    ports:
      - "6333:6333"  # API port
      - "6334:6334"  # Web UI port (http://localhost:6334 par dashboard)
    volumes:
      - ./qdrant_storage:/qdrant/storage  # Data save hoga idhar
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # PostgreSQL database (optional - chat history ke liye)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragchatbot
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

# Volumes
volumes:
  qdrant_storage:
  postgres_data:
